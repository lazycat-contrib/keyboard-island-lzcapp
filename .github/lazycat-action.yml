version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/keyboard-island.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git

build:
  run_buildscript: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Keyboard Island
    summary: "儿童打字启蒙冒险游戏：96 章节、收集贴纸、无挫败感设计"
