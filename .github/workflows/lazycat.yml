name: LazyCat Publish

on:
  schedule:
    - cron: "53 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/lazycat-action.yml
      - .github/workflows/lazycat.yml
      - lzc-build.yml
      - lzc-manifest.yml
      - package.yml
      - scripts/fetch-release.sh

permissions:
  contents: write
  pull-requests: write

jobs:
  # 跟随上游 tag：schedule 时检查上游新 release，有新版本则更新 package.yml 并重跑本工作流
  upstream-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.check.outputs.updated }}
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(grep '^version:' package.yml | awk '{print $2}')
          UPSTREAM=$(gh release view --repo shaom/keyboard-island --json tagName -q .tagName | sed 's/^v//')
          echo "current=$CURRENT upstream=$UPSTREAM"
          if [ "$UPSTREAM" = "$CURRENT" ]; then
            echo "Upstream unchanged."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$UPSTREAM" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not semver; skip"; echo "updated=false" >> "$GITHUB_OUTPUT"; exit 0; }
          sed -i "s/^version: .*/version: $UPSTREAM/" package.yml
          git config user.name czyt
          git config user.email czyt@users.noreply.github.com
          git commit -am "chore: update keyboard-island to $UPSTREAM"
          git push
          echo "updated=true" >> "$GITHUB_OUTPUT"

  lazycat:
    needs: upstream-check
    if: always() && !failure() && !cancelled()
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      dry-run: ${{ github.event_name == 'pull_request' }}
    secrets:
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
